org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# No daemon: on the dev VM the client<->daemon loopback TCP is intercepted
# by the sandbox (every TCP connection is answered by the runtime shim),
# so the daemon can never be reached. In-process/single-use builds hit the
# same wall there. CI runners are unaffected, and --no-daemon is standard
# practice on ephemeral CI anyway.
org.gradle.daemon=false
# No daemon: this VM resets the client<->daemon loopback connection, so
# the daemon always dies mid-handshake ("Connection reset by peer").
# In-process builds are slower but work; CI is unaffected (it would
# normally use --no-daemon there anyway).
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
